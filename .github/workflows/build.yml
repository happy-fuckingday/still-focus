name: Build and test Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test core and publish portable build
        shell: pwsh
        run: ./tools/publish.ps1
      # WPF snapshots are validated locally on an interactive Windows desktop.
      - uses: actions/upload-artifact@v4
        with:
          name: StillFocus-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
